spring.application.name=OrderService
server.port=8083

# MySQL settings for shared database in LAN deployment.
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/food_ordering_db
spring.datasource.username=team
spring.datasource.password=123456

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Set real LAN IPs via env vars when deploying on different machines.
external.user-service.base-url=${USER_SERVICE_URL:http://localhost:8081}
external.food-service.base-url=${FOOD_SERVICE_URL:http://localhost:8082}

# Frontend LAN origin(s), comma-separated when multiple origins are needed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8085}
